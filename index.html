<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSZip Fast Generator</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; margin: 0; min-height: 100vh; }
        #log { white-space: pre-wrap; font-size: 14px; line-height: 1.6; max-width: 100%; overflow-x: hidden; }
    </style>
</head>
<body>
<div id="log">⏳ Initializing...</div>
<script>
(function() {
    const log = document.getElementById('log');
    function append(text) {
        log.textContent += '\n' + text;
        console.log(text);
    }

    append('🚀 Starting (FAST MODE – No Compression)...');

    // ⚠️ CHANGED: 1 KB instead of 1 MB to prevent 30 GB browser memory crash.
    // 30,000 files * 1 KB = ~30 MB (Easily handled by any browser)
    const CHUNK_SIZE = 1024; 
    const TARGET_FILES = 30000;
    const CHUNK = new Uint8Array(CHUNK_SIZE);
    for (let i = 0; i < CHUNK.length; i++) CHUNK[i] = 65; // Fill with 'A'

    let isGenerating = false;
    let isDownloading = false;

    append('📦 Chunk created (' + CHUNK_SIZE + ' bytes)');

    function loadJSZip(callback) {
        if (typeof JSZip !== 'undefined') {
            append('✅ JSZip already loaded');
            callback();
            return;
        }
        append('⬇ Loading JSZip from CDN...');
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
        script.onload = () => { append('✅ JSZip loaded from primary CDN'); callback(); };
        script.onerror = () => {
            append('⚠️ Primary CDN failed, trying fallback...');
            const script2 = document.createElement('script');
            script2.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
            script2.onload = () => { append('✅ JSZip loaded from fallback CDN'); callback(); };
            script2.onerror = () => append('❌ All CDNs failed.');
            document.head.appendChild(script2);
        };
        document.head.appendChild(script);
    }

    function generateZip() {
        if (isGenerating) return;
        isGenerating = true;
        append('🔨 Starting zip generation (STORED mode)...');
        const zip = new JSZip();
        let completed = 0;

        function addBatch(start) {
            if (start >= TARGET_FILES) {
                isGenerating = false;
                append('✅ All ' + TARGET_FILES + ' files added to zip');
                append('📦 Generating blob (STORED mode)...');
                
                // Use a timeout to let the UI update before the heavy Blob generation
                setTimeout(() => {
                    zip.generateAsync({
                        type: 'blob',
                        compression: 'STORE'
                    }).then(function(blob) {
                        append('✅ Blob created: ' + (blob.size / 1024 / 1024).toFixed(2) + ' MB');
                        downloadBlob(blob);
                    }).catch(function(err) {
                        append('❌ Blob generation error: ' + err.message);
                    });
                }, 100);
                return;
            }

            const end = Math.min(start + 500, TARGET_FILES);
            for (let i = start; i < end; i++) {
                zip.file('photo_' + String(i).padStart(5, '0') + '.jpg', CHUNK);
            }
            completed = end;
            if (completed % 5000 === 0 || completed === TARGET_FILES) {
                append('📊 Progress: ' + Math.round((completed / TARGET_FILES) * 100) + '% (' + completed + '/' + TARGET_FILES + ')');
            }
            setTimeout(function() { addBatch(end); }, 0); // Use 0ms for faster execution
        }

        addBatch(0);
    }

    function downloadBlob(blob) {
        if (isDownloading) return;
        isDownloading = true;
        append('⬇ Triggering download...');
        try {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'photos.zip';
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            append('✅ Download should start now!');
            setTimeout(function() {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                isDownloading = false;
            }, 2000);
        } catch (e) {
            isDownloading = false;
            append('❌ Download error: ' + e.message);
        }
    }

    function start() {
        append('📋 Loading JSZip library...');
        loadJSZip(function() {
            append('✅ Library ready, starting generation...');
            generateZip();
        });
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        start();
    } else {
        document.addEventListener('DOMContentLoaded', start);
    }
})();
</script>
</body>
</html>
