<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Massive ZIP Generator</title>
    <style>
        body {
            background: #000;
            color: #0f0;
            font-family: monospace;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        #log {
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.6;
        }
        #startBtn {
            display: none;
            background: #0f0;
            color: #000;
            border: none;
            padding: 14px 28px;
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<button id="startBtn">🚀 Click to Start Download</button>
<div id="log">⏳ Loading libraries...</div>

<script src="https://cdn.jsdelivr.net/npm/streamsaver@2.0.6/StreamSaver.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.34/dist/zip.min.js"></script>

<script>
(function () {
    const logEl = document.getElementById('log');
    const btn = document.getElementById('startBtn');

    function append(text) {
        logEl.textContent += '\n' + text;
        console.log(text);
    }

    const TARGET_FILES = 30000;
    const CHUNK_SIZE = 1024 * 1024; // 1 MB
    let started = false;

    async function generate() {
        if (started) return;
        started = true;
        btn.style.display = 'none';

        append('🚀 Starting generation...');
        append('📋 Target: ' + TARGET_FILES + ' files × 1 MB ≈ ' + (TARGET_FILES / 1024).toFixed(1) + ' GB');

        if (!window.isSecureContext) {
            append('');
            append('❌ ERROR: StreamSaver requires HTTPS or localhost.');
            append('   Current protocol: ' + location.protocol);
            append('');
            append('💡 FIX: Run a local server:');
            append('   python -m http.server 8000');
            append('   Then open http://localhost:8000');
            return;
        }

        if (typeof streamSaver === 'undefined') {
            append('❌ StreamSaver library failed to load.');
            return;
        }

        try {
            append('🔗 Opening download stream...');
            
            // StreamSaver returns a native WritableStream
            const fileStream = streamSaver.createWriteStream('photos_30gb.zip');

            append('📦 Initializing ZIP writer...');
            
            // zip.js ZipWriter accepts native WritableStream directly
            const zipWriter = new zip.ZipWriter(fileStream, {
                level: 0,
                bufferedWrite: true
            });

            const CHUNK = new Uint8Array(CHUNK_SIZE);
            CHUNK.fill(65);

            append('🔨 Streaming files to disk...');
            const startTime = performance.now();

            for (let i = 0; i < TARGET_FILES; i++) {
                const filename = 'photo_' + String(i).padStart(5, '0') + '.jpg';
                
                // Add file to ZIP stream
                await zipWriter.add(filename, new zip.Uint8ArrayReader(CHUNK));

                if (i > 0 && i % 500 === 0) {
                    const pct = Math.round((i / TARGET_FILES) * 100);
                    const elapsed = ((performance.now() - startTime) / 1000).toFixed(0);
                    const gbWritten = ((i * CHUNK_SIZE) / (1024 * 1024 * 1024)).toFixed(2);
                    append('📊 ' + pct + '% (' + i + '/' + TARGET_FILES + ') – ' + gbWritten + ' GB [' + elapsed + 's]');
                    await new Promise(r => setTimeout(r, 0));
                }
            }

            append('📦 Finalizing ZIP...');
            await zipWriter.close();

            const duration = ((performance.now() - startTime) / 1000).toFixed(1);
            append('');
            append('✅ SUCCESS! ~30 GB saved.');
            append('⏱️ Time: ' + duration + ' seconds');

        } catch (err) {
            append('');
            append('❌ Error: ' + err.message);
            console.error(err);
            append('');
            append('💡 TROUBLESHOOTING:');
            append('   • Ensure you\'re on HTTPS or localhost');
            append('   • Try a different browser (Chrome/Edge/Firefox)');
            append('   • Check browser console for details');
        }
    }

    // Auto-start on load
    window.addEventListener('load', function () {
        append('✅ Libraries loaded.');

        if (window.isSecureContext && typeof streamSaver !== 'undefined') {
            append('🔄 Auto-starting in 1 second...');
            setTimeout(function () {
                generate().catch(function (err) {
                    append('⚠️ Auto-start failed: ' + err.message);
                    append('👇 Click button below to try manually');
                    btn.style.display = 'block';
                    started = false;
                });
            }, 1000);
        } else {
            append('⚠️ Not on HTTPS. Click button to start.');
            btn.style.display = 'block';
        }
    });

    btn.onclick = generate;
})();
</script>
</body>
</html>
