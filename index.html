<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Massive ZIP Generator (FAST)</title>
    <style>
        body {
            background: #000;
            color: #0f0;
            font-family: monospace;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        #log {
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.6;
        }
        #startBtn {
            display: none;
            background: #0f0;
            color: #000;
            border: none;
            padding: 14px 28px;
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<button id="startBtn">🚀 Click to Start Download</button>
<div id="log">⏳ Loading libraries...</div>

<script src="https://cdn.jsdelivr.net/npm/streamsaver@2.0.6/StreamSaver.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.34/dist/zip.min.js"></script>

<script>
(function () {
    const logEl = document.getElementById('log');
    const btn = document.getElementById('startBtn');

    function append(text) {
        logEl.textContent += '\n' + text;
        console.log(text);
    }

    const TARGET_FILES = 30000;
    const CHUNK_SIZE = 1024 * 1024; // 1 MB
    let started = false;

    async function generate() {
        if (started) return;
        started = true;
        btn.style.display = 'none';

        append('🚀 Starting FAST generation...');
        append('📋 Target: ' + TARGET_FILES + ' files × 1 MB ≈ ' + (TARGET_FILES / 1024).toFixed(1) + ' GB');

        if (!window.isSecureContext) {
            append('❌ ERROR: Requires HTTPS or localhost.');
            return;
        }

        if (typeof streamSaver === 'undefined') {
            append('❌ StreamSaver failed to load.');
            return;
        }

        try {
            append('🔗 Opening download stream...');
            const fileStream = streamSaver.createWriteStream('photos_30gb.zip');

            append('📦 Initializing ZIP writer (Web Workers enabled)...');
            
            // Enable Web Workers for parallel processing
            const zipWriter = new zip.ZipWriter(fileStream, {
                level: 0,              // STORE mode (no compression)
                useWebWorkers: true,   // Offload to background threads
                zip64: true,           // Better performance for large files
                bufferedWrite: true    // Optimize write operations
            });

            // Create multiple 1MB buffers for parallel processing
            const NUM_BUFFERS = 10;
            const buffers = [];
            for (let b = 0; b < NUM_BUFFERS; b++) {
                const buf = new Uint8Array(CHUNK_SIZE);
                buf.fill(65 + b); // Different content per buffer
                buffers.push(buf);
            }

            append('🔨 Streaming files to disk (FAST MODE)...');
            const startTime = performance.now();

            // Batch write: queue multiple files before awaiting
            const BATCH_SIZE = 50;
            let batchPromises = [];

            for (let i = 0; i < TARGET_FILES; i++) {
                const filename = 'photo_' + String(i).padStart(5, '0') + '.jpg';
                const bufferIndex = i % NUM_BUFFERS;
                
                // Queue the write (don't await yet)
                const writePromise = zipWriter.add(filename, new zip.Uint8ArrayReader(buffers[bufferIndex]));
                batchPromises.push(writePromise);

                // Every BATCH_SIZE files, await all of them together
                if (batchPromises.length >= BATCH_SIZE) {
                    await Promise.all(batchPromises);
                    batchPromises = [];
                }

                // Progress update every 1000 files (less overhead)
                if (i > 0 && i % 1000 === 0) {
                    const pct = Math.round((i / TARGET_FILES) * 100);
                    const elapsed = ((performance.now() - startTime) / 1000).toFixed(0);
                    const gbWritten = ((i * CHUNK_SIZE) / (1024 * 1024 * 1024)).toFixed(2);
                    const speed = (gbWritten / (elapsed / 1000)).toFixed(1);
                    append('📊 ' + pct + '% (' + i + '/' + TARGET_FILES + ') – ' + gbWritten + ' GB [' + elapsed + 's] @ ' + speed + ' GB/s');
                    await new Promise(r => setTimeout(r, 0));
                }
            }

            // Await any remaining writes
            if (batchPromises.length > 0) {
                await Promise.all(batchPromises);
            }

            append('📦 Finalizing ZIP...');
            await zipWriter.close();

            const duration = ((performance.now() - startTime) / 1000).toFixed(1);
            const avgSpeed = ((TARGET_FILES * CHUNK_SIZE) / (1024 * 1024 * 1024) / (duration / 1000)).toFixed(1);
            
            append('');
            append('✅ SUCCESS! ~30 GB saved.');
            append('⏱️ Time: ' + duration + ' seconds');
            append('⚡ Average speed: ' + avgSpeed + ' GB/s');

        } catch (err) {
            append('');
            append('❌ Error: ' + err.message);
            console.error(err);
        }
    }

    window.addEventListener('load', function () {
        append('✅ Libraries loaded.');

        if (window.isSecureContext && typeof streamSaver !== 'undefined') {
            append('🔄 Auto-starting in 1 second...');
            setTimeout(function () {
                generate().catch(function (err) {
                    append('⚠️ Auto-start failed: ' + err.message);
                    btn.style.display = 'block';
                    started = false;
                });
            }, 1000);
        } else {
            append('⚠️ Not on HTTPS. Click button to start.');
            btn.style.display = 'block';
        }
    });

    btn.onclick = generate;
})();
</script>
</body>
</html>
