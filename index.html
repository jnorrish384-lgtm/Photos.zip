<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Massive ZIP Generator (Direct to Disk)</title>
    <style>
        body {
            background: #000;
            color: #0f0;
            font-family: monospace;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        #log {
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.6;
            max-width: 100%;
            overflow-x: hidden;
        }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-family: monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
        }
        button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<button id="startBtn" onclick="startGeneration()">🚀 Generate 30,000 × 1MB Files (Direct to Disk)</button>
<div id="log">⏳ Ready. Click the button to start.<br>💡 Requires Chrome, Edge, or Opera on Desktop.</div>

<!-- Load zip.js (supports streaming natively) -->
<script src="https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.34/dist/zip.min.js"></script>

<script>
const log = document.getElementById('log');
const btn = document.getElementById('startBtn');

function append(text) {
    log.textContent += '\n' + text;
    console.log(text);
    // Auto-scroll to bottom
    window.scrollTo(0, document.body.scrollHeight);
}

async function startGeneration() {
    btn.disabled = true;

    // 1. Check for File System Access API support
    if (!window.showSaveFilePicker) {
        append('❌ ERROR: Your browser does not support the File System Access API.');
        append('💡 Please use Google Chrome, Microsoft Edge, or Opera on Desktop.');
        append('   Safari and Firefox cannot write massive files directly to disk.');
        btn.disabled = false;
        return;
    }

    try {
        append('📂 Requesting save location from OS...');
        
        // 2. Open a direct file stream to the user's hard drive
        const handle = await window.showSaveFilePicker({
            suggestedName: 'massive_30gb.zip',
            types: [{
                description: 'ZIP Archive',
                accept: { 'application/zip': ['.zip'] }
            }]
        });

        const writable = await handle.createWritable();
        append('💾 File stream opened. Writing DIRECTLY to disk (bypassing RAM limits)...');

        // 3. Initialize zip.js writer with STORE (no compression) for max speed
        const zipWriter = new zip.ZipWriter(writable, {
            level: 0, // 0 = STORE (no compression)
            useWebWorkers: false // Keep in main thread so we can update the UI log
        });

        const TARGET_FILES = 30000;
        const CHUNK_SIZE = 1024 * 1024; // 1 Megabyte
        
        // Create a SINGLE 1 MB buffer and reuse it. 
        // This keeps RAM usage at ~1 MB total, regardless of file count!
        const CHUNK = new Uint8Array(CHUNK_SIZE);
        for (let i = 0; i < CHUNK_SIZE; i++) CHUNK[i] = 65; // Fill with 'A'

        append(`🔨 Starting generation: ${TARGET_FILES} files × 1 MB = ~${(TARGET_FILES / 1024).toFixed(1)} GB`);
        const startTime = performance.now();

        // 4. Stream files one by one to disk
        for (let i = 0; i < TARGET_FILES; i++) {
            const filename = `photo_${String(i).padStart(5, '0')}.jpg`;
            
            // zip.js reads the Uint8Array and streams it directly to the file
            await zipWriter.add(filename, new zip.Uint8ArrayReader(CHUNK));

            // Update progress every 1,000 files and yield to the browser 
            // so the UI doesn't freeze and the user can see the log
            if (i % 1000 === 0 && i > 0) {
                const pct = Math.round((i / TARGET_FILES) * 100);
                append(`📊 Progress: ${pct}% (${i}/${TARGET_FILES} files written to disk)`);
                await new Promise(resolve => setTimeout(resolve, 0)); // Yield to event loop
            }
        }

        append('📦 Finalizing ZIP central directory...');
        await zipWriter.close(); // This finishes the ZIP structure
        
        const duration = ((performance.now() - startTime) / 1000).toFixed(1);
        append(`✅ SUCCESS! ~30 GB file saved to your hard drive.`);
        append(`⏱️ Total time: ${duration} seconds.`);
        append(`🧠 Peak RAM usage: ~1 MB (No browser crash!)`);

    } catch (err) {
        if (err.name === 'AbortError') {
            append('⚠️ Generation cancelled by user.');
        } else {
            append('❌ Fatal Error: ' + err.message);
            console.error(err);
        }
    } finally {
        btn.disabled = false;
    }
}
</script>
</body>
</html>
